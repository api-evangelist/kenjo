actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Kenjo's own public API is
    request/response REST secured with a bearer token, and no server-push
    transport (WebSocket, SSE, or documented webhook) is published, so no
    AsyncAPI document was created.
