aid: kenjo
name: Kenjo
review:
  question: Does Kenjo expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Kenjo's documented API surface
    (kenjo.readme.io) is entirely request/response REST over HTTPS, secured
    with a bearer token. There is no server-push transport - no WebSocket
    (ws:// or wss://), no Server-Sent Events, and no publicly documented
    webhook/event stream - on Kenjo's own API to model. Employees,
    attendances, time-off requests, documents, compensation, org structure,
    and recruiting are all pulled or pushed synchronously over REST.
findings:
  summary: |
    Kenjo does not publish a documented public WebSocket API. Kenjo is an
    all-in-one HR (HRIS) platform. Its public API is a REST API documented at
    kenjo.readme.io, with a production base of https://api.kenjo.io/api/v1 and
    a sandbox base of https://sandbox-api.kenjo.io/api/v1. Authentication is a
    bearer token: you exchange a generated API key via POST /auth/login and
    send the token in the Authorization header (a missing/invalid/expired
    token returns 401 UNAUTHORIZED). Every documented resource - employees and
    their profile sections, attendances and time tracking, time-off requests
    and balances, company documents, compensation/contracts/salaries,
    organizational structure (companies, offices, departments, teams, areas,
    calendars), and recruiting (positions, candidates, applications) - is
    plain request/response REST. No realtime, bidirectional, or streaming
    WebSocket endpoint is documented anywhere on Kenjo's API.
  accessModel: |
    Access is gated, not open self-service. The API is a Connect-plan (top
    tier) capability and must be activated for a given account (sandbox or
    production) by Kenjo's Customer Success team. Customers then generate API
    keys in the web app under Settings > Integrations > API. This is a
    partner/customer API rather than a fully public developer program, but the
    endpoint reference itself is publicly readable at kenjo.readme.io.
  endpointsModeled: false
  endpointsNote: |
    The paths and HTTP methods captured in the OpenAPI were taken from Kenjo's
    published API reference (kenjo.readme.io) and are not fabricated. Request
    and response body schemas in the OpenAPI are modeled representations where
    Kenjo does not publish full field-level schemas; the operations, paths, and
    methods themselves are real and documented.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.kenjo.io/api/v1
      documented: true
      note: Production REST API. Sandbox base is https://sandbox-api.kenjo.io/api/v1.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Kenjo's API reference as of the review date.
    - protocol: Webhook
      scheme: https
      documented: false
      note: No publicly documented outbound webhook/event API on Kenjo's own REST surface as of the review date.
