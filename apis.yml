aid: kenjo
url: https://raw.githubusercontent.com/api-evangelist/kenjo/refs/heads/main/apis.yml
name: Kenjo
kind: company
description: Kenjo is an all-in-one human resources (HRIS) software platform for
  small and mid-sized companies, with a strong focus on deskless and shift-based
  teams. It covers the full employee lifecycle - employee database, attendance and
  time tracking, absence and time-off management, document management, payroll and
  compensation, shift planning, performance reviews, and recruiting. Kenjo exposes a
  documented REST API (base https://api.kenjo.io/api/v1, sandbox
  https://sandbox-api.kenjo.io/api/v1) that lets customers read and write employees,
  attendances, time-off requests, company documents, compensation, org structure,
  and recruiting data. API access is gated - it is available on Kenjo's top-tier
  Connect plan and must be activated by the Kenjo Customer Success team, then keys
  are generated in Settings > Integrations > API and exchanged for a bearer token.
