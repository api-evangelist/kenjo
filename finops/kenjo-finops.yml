description: >-
  FinOps view of Kenjo spend. Kenjo is per-employee-per-month HR SaaS billed
  monthly or annually across Starter, Growth, and Connect tiers, with cost
  scaling on headcount and enabled modules. The API is not separately metered:
  it is an entitlement of the top-tier Connect plan (and requires Customer
  Success activation), so the marginal cost of API usage is effectively zero
  once you hold Connect. The dominant cost driver is therefore seat count times
  the Connect per-employee rate, not API call volume. Annual billing carries
  roughly a 10% discount over monthly.
notes: >-
  Per-employee rates are quote/calculator-based on Kenjo's side (Connect is
  "book a demo"); reconcile the actual rate and billing currency (EUR) with
  Kenjo Sales. There is no usage-metered API line item to optimize - cost
  optimization is about right-sizing seats and choosing annual over monthly.
