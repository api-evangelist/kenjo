meters:
- name: active_employees
  description: Billable employees (seats) per month; the primary cost driver across all tiers.
  unit: employees
  aggregation: sum
  dimensions:
  - account
  - plan
- name: plan_tier
  description: Subscription tier (Starter, Growth, Connect) determining per-employee rate and module access, including API entitlement.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: api_calls
  description: Kenjo API requests. Not separately billed; included with the Connect plan entitlement (informational only).
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track billable seat count and plan tier; API usage carries no separate charge, so watch headcount and tier rather than call volume.
- name: Allocation
  description: Attribute the Kenjo subscription to HR/People Ops cost centers; if the API drives an integration for another team, note the Connect requirement in that team's tooling budget.
- name: Optimization
  description: Right-size seats to active employees, prefer annual billing for the discount, and confirm you actually need Connect (only take it if API/integrations or its other exclusive features are required).
- name: Accountability
  description: Assign an owner for the Kenjo subscription; review seat count and tier against actual usage each renewal.
